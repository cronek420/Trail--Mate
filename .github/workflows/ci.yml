name: Trail-Mate V1 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test planner logic
        run: npm test

      - name: Build Next.js app
        run: npm run build

  nps-data-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe NPS public trails
        run: node scripts/nps-appa-probe.mjs

      - name: Upload NPS probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nps-appa-probe
          path: artifacts/nps
          if-no-files-found: ignore
          retention-days: 7

  anst-treadway-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe official ANST treadway
        run: node scripts/anst-treadway-probe.mjs

      - name: Upload ANST treadway artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anst-treadway-probe
          path: artifacts/anst
          if-no-files-found: ignore
          retention-days: 7
